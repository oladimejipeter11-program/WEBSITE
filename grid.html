<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid practice</title>
  </head>
  <body style="padding-bottom: 1000;">
    <div style="display: grid; grid-template-columns: 100px 100px">
      <div style="background-color: lightblue">div 1</div>
      <div style="background-color: lightpink;">
        div 2
        <p>text</p>
      </div>
    </div>

    <div
      style="display: grid; grid-template-columns: 100px 1fr; margin-top: 30px"
    >
      <div style="background-color: lightblue">div 1</div>
      <div style="background-color: lightpink">div 2</div>
    </div>

    <div
      style="
        display: grid;
        grid-template-columns: 100px 1fr 2fr;
        margin-top: 30px;
      "
    >
      <div style="background-color: lightblue">div 1</div>
      <div style="background-color: lightpink">div 2</div>
      <div style="background-color: lightblue">div 3</div>
    </div>

      <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        margin-top: 30px; column-gap: 20px; row-gap: 40px;"
    >
      <div style="background-color: lightblue; height: 200px;">div 1</div>
      <div style="background-color: lightpink; height: 200px;">div 2</div>
      <div style="background-color: lightblue">div 3</div>
      <div style="background-color: lightpink; height: 200px;">div 2</div>
      <div style="background-color: lightblue">div 3</div>
      <div style="background-color: lightpink; height: 200px;">div 2</div>


  </body>
</html>
